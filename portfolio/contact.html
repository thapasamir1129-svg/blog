        .info {

                </div>

                </div>
               <div class="info">

                <input type="text" id="project type" placeholder="project type"><br>
               </div>
               <div class="info">
                 <textarea name="" id="" cols="30" rows="5" placeholder="Tell me about your project"></textarea><br>
               </div>
                <button>send message</button>

        </div>
        <div>
