<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#1f2735;
    color:white;
}

/* Sidebar */

.sidebar{
    width:240px;
    height:100vh;
    background:#1b2230;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:15px 10px;
    cursor:pointer;
    border-radius:8px;
}

.sidebar ul li:hover{
    background:#2c3b55;
}

.sidebar i{
    margin-right:10px;
}

/* Main */

.main{
    flex:1;
}

/* Navbar */

.navbar{
    height:70px;
    background:#263248;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.navbar input{
    width:350px;
    padding:10px;
    border:none;
    border-radius:5px;
}

.right{
    display:flex;
    align-items:center;
    gap:20px;
}

.right img{
    width:40px;
    height:40px;
    border-radius:50%;
}

.main h1{
    margin:25px;
}

/* Cards */

.cards{
    display:flex;
    gap:20px;
    margin:25px;
}

.card{
    flex:1;
    padding:30px;
    border-radius:10px;
}

.blue{
    background:#2962ff;
}

.orange{
    background:#ff8a65;
}

.card h2{
    margin:15px 0;
    font-size:35px;
}
</style>
<body>

<div class="sidebar">
    <h2>Studio</h2>

    <ul>
        <li><i class="fa-solid fa-house"></i> Dashboard</li>
        <li><i class="fa-solid fa-chart-line"></i> Analytics</li>
        <li><i class="fa-solid fa-envelope"></i> Email</li>
        <li><i class="fa-solid fa-layer-group"></i> Widgets</li>
        <li><i class="fa-solid fa-table"></i> Tables</li>
        <li><i class="fa-solid fa-chart-pie"></i> Charts</li>
        <li><i class="fa-solid fa-location-dot"></i> Maps</li>
        <li><i class="fa-solid fa-file"></i> Pages</li>
        <li><i class="fa-solid fa-user"></i> Users</li>
        <li><i class="fa-solid fa-gear"></i> Settings</li>
    </ul>
</div>

<div class="main">

    <div class="navbar">
        <input type="text" placeholder="Search...">

        <div class="right">
            <i class="fa-solid fa-bell"></i>
            <img src="https://i.pravatar.cc/40" alt="">
        </div>
    </div>

    <h1>Hi, Sean 👋</h1>

    <div class="cards">

        <div class="card blue">
            <h3>Weekly Earnings</h3>
            <h2>$2,999</h2>
            <p>32% increase compared to last week</p>
        </div>

        <div class="card orange">
            <h3>New Orders</h3>
            <h2>56</h2>
            <p>16% increase compared to last week</p>
        </div>

    </div>

</div>

</body>
</html>
